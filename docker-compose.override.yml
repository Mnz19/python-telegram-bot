## Loaded automatically by `docker compose up` alongside docker-compose.yml.
## Convenience for iterating on the bot inside Docker: bind-mounts the source
## tree so edits on the host are picked up without rebuilding the image.
## (Restart the affected service to pick up the change — this project has no
## autoreloader wired in for the bot/worker/beat processes.)
##
## For most day-to-day development, running `manage.py runbot` directly on
## the host with SQLite (see README) is faster and doesn't need Docker at all.

services:
  bot:
    volumes:
      - .:/app
    environment:
      DJANGO_DEBUG: "true"

  worker:
    volumes:
      - .:/app
    environment:
      DJANGO_DEBUG: "true"

  beat:
    volumes:
      - .:/app
    environment:
      DJANGO_DEBUG: "true"
